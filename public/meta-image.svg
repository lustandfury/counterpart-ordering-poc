<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f7f6f2"/>

  <!-- Center content area -->
  <g transform="translate(600, 315)">
    <!-- Logo mark: yellow circle with check and lines -->
    <circle cx="-150" cy="0" r="80" fill="#ffca05"/>

    <!-- Lines on counter slip -->
    <path d="M -200 -30 h 60" stroke="#1c1c1e" stroke-width="12" stroke-linecap="round" opacity="0.45"/>
    <path d="M -200 0 h 40" stroke="#1c1c1e" stroke-width="12" stroke-linecap="round" opacity="0.45"/>
    <path d="M -200 30 h 35" stroke="#1c1c1e" stroke-width="12" stroke-linecap="round" opacity="0.45"/>

    <!-- Checkmark -->
    <path d="M -80 20 l 30 30 l 60 -70" stroke="#1c1c1e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Wordmark text -->
    <text x="60" y="25" font-family="system-ui, sans-serif" font-size="120" font-weight="bold" fill="#1c1c1e" letter-spacing="-2.4">
      counter<tspan font-weight="500" fill="#5c5c61">part</tspan>
    </text>

    <!-- Tagline -->
    <text x="60" y="80" font-family="system-ui, sans-serif" font-size="36" fill="#5c5c61" letter-spacing="0.5">
      outside-in sketch of AI ordering
    </text>
  </g>
</svg>
